language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: "app/api/**"
      instructions: |
        Every API route must call getServerSession(authOptions) before any data access.
        All endpoints must be under /api/v1/ (not /api/v1 root or unversioned).
        Every POST/PATCH/PUT route must validate body with a Zod schema from lib/schemas/.
        All DB queries must include `where: { tenantId: session.user.tenantId }` — no unscoped queries.
        Missing tenantId on a multi-tenant query is a CRITICAL violation — flag it immediately.
        AI generation endpoints must be rate-limited via lib/ratelimit.ts.
    - path: "app/api/v1/generate/**"
      instructions: |
        Must validate request body with Zod schema from lib/schemas/.
        Must call checkRateLimit from lib/ratelimit.ts with the GENERATE limit.
        Must save the generated asset to DB with tenantId and correct type/metadata.
        Must wrap all external AI API calls with withRetry() from lib/retry.ts.
    - path: "services/**"
      instructions: |
        All calls to fal.ai, ElevenLabs, OpenAI, and Anthropic must be wrapped with withRetry() from lib/retry.ts.
        No API keys may be hardcoded — must come from process.env.
        as any casts are acceptable only when the SDK's TypeScript types are incomplete; require a comment explaining why.
        uploadFromUrl must validate the source URL against the allowlist in lib/storage.ts before fetching.
    - path: "lib/schemas/**"
      instructions: |
        Schemas must validate all fields — no z.any() without a comment explaining why.
        Reuse schemas between frontend hooks (useGenerate) and backend API routes.
    - path: "lib/crypto.ts"
      instructions: |
        TOKEN_ENCRYPTION_KEY must be validated on startup — never silently fall back to a default.
        All encrypt/decrypt calls must handle failures explicitly and log before any fallback.
    - path: "prisma/**"
      instructions: |
        All multi-tenant tables must have tenantId referencing Tenant.
        Use migration files — never db push in production.
        Do not drop columns without explicit confirmation.
        Every migration must be reviewed for cross-tenant data leakage.
    - path: "components/**"
      instructions: |
        No hardcoded hex color values — use Tailwind tokens from tailwind.config.ts only.
        No direct DB calls or fetch to external APIs — all data through /api/v1/ routes.
        No auth or session logic — consume from NextAuth session only.
        Component files must stay under 200 lines; flag if exceeded.
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
