name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Minimal stubs so prisma generate and tsc don't fail on env access
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  NEXTAUTH_SECRET: ci-secret-placeholder
  NEXTAUTH_URL: http://localhost:3004

jobs:
  validate:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # Remaining moderates: postcss inside next (no non-breaking fix) and uuid
        # inside next-auth@4 (requires v5 major upgrade). Fail CI on critical only.
        run: npm audit --audit-level=critical

      - name: Secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # Non-blocking: `next lint` was removed in Next 16, so `npm run lint`
        # currently exits 1 (it treats "lint" as a directory). Type-check and
        # build remain hard gates. TODO: migrate to the ESLint flat config CLI
        # (eslint 9 + eslint-config-next flat preset) and make this blocking again.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

