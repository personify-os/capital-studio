[build]
builder = "NIXPACKS"
nixpacksVersion = "1"

[build.nixpacks]
nodeVersion = "20"

[deploy]
# Apply any pending Prisma migrations before the server starts, so schema
# changes ship automatically on deploy (Railway does not run migrations otherwise).
startCommand = "npx prisma migrate deploy && next start -p ${PORT:-3004}"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Every 30 minutes (was every minute). The per-minute cron queried the DB 1,440×/day,
# which kept the Neon compute awake 24/7. With a 30-min gap the DB scales to zero
# (5-min idle threshold) between runs, minimizing compute. Scheduled posts publish
# within ~30 min of their time.
[cron.publish]
schedule = "*/30 * * * *"
command = "curl -s -X POST https://studio.lhccapital.org/api/v1/cron/publish -H \"Authorization: Bearer $CRON_SECRET\""
