[build]
builder = "NIXPACKS"
nixpacksVersion = "1"

[build.nixpacks]
nodeVersion = "20"

[deploy]
# Apply any pending Prisma migrations before the server starts, so schema
# changes ship automatically on deploy (Railway does not run migrations otherwise).
startCommand = "npx prisma migrate deploy && next start -p ${PORT:-3004}"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Every 15 minutes (was every minute). The per-minute cron queried the DB 1,440×/day,
# which — with Neon autosuspend — kept the compute awake 24/7. Scheduled posts now
# publish within ~15 min of their time, letting the DB idle and suspend between runs.
[cron.publish]
schedule = "*/15 * * * *"
command = "curl -s -X POST https://studio.lhccapital.org/api/v1/cron/publish -H \"Authorization: Bearer $CRON_SECRET\""
